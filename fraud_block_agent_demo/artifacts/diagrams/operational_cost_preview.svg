<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .mono { font-family: Menlo, Monaco, Consolas, monospace; }
    .ink { fill: #172033; }
    .muted { fill: #5f6b7a; }
    .blue { fill: #2563a8; }
    .cyan { fill: #087ea4; }
    .green { fill: #168653; }
    .orange { fill: #b65f00; }
    .red { fill: #c83b3b; }
  </style>

  <!-- Header -->
  <text x="65" y="58" class="sans ink" font-size="34" font-weight="700">Operational Metrics — API Cost and Business Value</text>
  <text x="65" y="95" class="sans muted" font-size="17">Estimate direct model expense, then monitor whether that spending produces safe and contained customer outcomes.</text>
  <line x1="65" y1="121" x2="1535" y2="121" stroke="#d8dee8" stroke-width="2"/>

  <!-- Definition -->
  <rect x="65" y="146" width="900" height="98" rx="14" fill="#f3f8fc" stroke="#b9c9da" stroke-width="2"/>
  <rect x="65" y="146" width="9" height="98" fill="#20a7d3"/>
  <text x="93" y="178" class="sans cyan" font-size="18" font-weight="700">DEFINITION</text>
  <text x="93" y="209" class="sans ink" font-size="18">API cost is the direct model-inference expense attributed to serving a session.</text>
  <text x="93" y="232" class="sans muted" font-size="16">It is one operational metric—not the system’s total cost of ownership.</text>

  <rect x="988" y="146" width="547" height="98" rx="14" fill="#fff7e8" stroke="#e4b264" stroke-width="2"/>
  <text x="1016" y="178" class="sans orange" font-size="18" font-weight="700">BUSINESS LENS</text>
  <text x="1016" y="209" class="sans ink" font-size="18">Measure cost per successful, safe resolution.</text>
  <text x="1016" y="232" class="sans muted" font-size="16">Low API spend has value only when the workflow contains the call.</text>

  <!-- Main columns -->
  <text x="65" y="282" class="sans blue" font-size="21" font-weight="700">ANNUAL API-COST FUNNEL</text>
  <text x="1000" y="282" class="sans green" font-size="21" font-weight="700">OTHER OPERATIONAL METRICS</text>

  <!-- Funnel: starting volume -->
  <rect x="65" y="302" width="875" height="62" rx="12" fill="#e8f1fb" stroke="#4b79b5" stroke-width="2"/>
  <text x="91" y="329" class="sans blue" font-size="17" font-weight="700">500,000 annual connected customer calls</text>
  <text x="91" y="352" class="sans muted" font-size="15">Annual workload entering the fraud-block agent</text>

  <!-- Split arrows -->
  <line x1="502" y1="364" x2="502" y2="386" stroke="#7f8ea3" stroke-width="2"/>
  <line x1="502" y1="386" x2="278" y2="386" stroke="#7f8ea3" stroke-width="2"/>
  <line x1="502" y1="386" x2="728" y2="386" stroke="#7f8ea3" stroke-width="2"/>
  <line x1="278" y1="386" x2="278" y2="400" stroke="#7f8ea3" stroke-width="2"/>
  <line x1="728" y1="386" x2="728" y2="400" stroke="#7f8ea3" stroke-width="2"/>

  <!-- Funnel branches -->
  <rect x="65" y="400" width="425" height="102" rx="12" fill="#f7fcf9" stroke="#2f9a67" stroke-width="2"/>
  <text x="88" y="430" class="sans green" font-size="18" font-weight="700">60% successful block removal</text>
  <text x="88" y="458" class="mono ink" font-size="16">300,000 sessions × 6 calls</text>
  <text x="88" y="485" class="mono green" font-size="17" font-weight="700">= 1,800,000 API calls</text>

  <rect x="515" y="400" width="425" height="102" rx="12" fill="#fff8f8" stroke="#cf7a7a" stroke-width="2"/>
  <text x="538" y="430" class="sans red" font-size="18" font-weight="700">40% unsuccessful sessions</text>
  <text x="538" y="458" class="mono ink" font-size="16">200,000 sessions × 5 calls</text>
  <text x="538" y="485" class="mono red" font-size="17" font-weight="700">= 1,000,000 API calls</text>

  <!-- Merge -->
  <line x1="278" y1="502" x2="278" y2="520" stroke="#7f8ea3" stroke-width="2"/>
  <line x1="728" y1="502" x2="728" y2="520" stroke="#7f8ea3" stroke-width="2"/>
  <line x1="278" y1="520" x2="728" y2="520" stroke="#7f8ea3" stroke-width="2"/>
  <line x1="502" y1="520" x2="502" y2="535" stroke="#7f8ea3" stroke-width="2"/>

  <rect x="65" y="535" width="875" height="82" rx="12" fill="#f5f7fa" stroke="#cbd3df" stroke-width="2"/>
  <text x="88" y="564" class="sans ink" font-size="18" font-weight="700">2,800,000 annual Claude Fable 5 API calls</text>
  <text x="88" y="592" class="mono muted" font-size="15">Per-call proxy: 619.5 input tokens + 106.5 output tokens</text>
  <text x="605" y="564" class="mono ink" font-size="15">1.7346B input × $10/MTok = $17,346</text>
  <text x="605" y="592" class="mono ink" font-size="15">298.2M output × $50/MTok = $14,910</text>

  <!-- KPI cards -->
  <rect x="65" y="637" width="275" height="116" rx="13" fill="#f3f8fc" stroke="#aac3e4" stroke-width="2"/>
  <text x="83" y="666" class="sans blue" font-size="15" font-weight="700">ANNUAL MODEL API COST</text>
  <text x="83" y="712" class="sans ink" font-size="31" font-weight="700">$32,256</text>
  <text x="83" y="739" class="sans muted" font-size="13">Successful + unsuccessful traffic</text>

  <rect x="357" y="637" width="275" height="116" rx="13" fill="#f7fcf9" stroke="#a9d8be" stroke-width="2"/>
  <text x="375" y="666" class="sans green" font-size="15" font-weight="700">NET MODEL-ONLY SAVINGS</text>
  <text x="375" y="712" class="sans green" font-size="31" font-weight="700">$4.17M</text>
  <text x="375" y="739" class="sans muted" font-size="13">$4.20M avoided human cost − API</text>

  <rect x="649" y="637" width="291" height="116" rx="13" fill="#fff7e8" stroke="#e4b264" stroke-width="2"/>
  <text x="667" y="666" class="sans orange" font-size="15" font-weight="700">DIRECT COST ADVANTAGE</text>
  <text x="667" y="712" class="sans orange" font-size="31" font-weight="700">~130×</text>
  <text x="667" y="739" class="sans muted" font-size="13">$4.20M ÷ $32,256</text>

  <!-- Right metrics panel -->
  <rect x="975" y="302" width="560" height="451" rx="14" fill="#f8faff" stroke="#aac3e4" stroke-width="2"/>

  <text x="1000" y="337" class="sans ink" font-size="17" font-weight="700">Customer outcome</text>
  <text x="1000" y="366" class="sans green" font-size="15" font-weight="700">Containment rate</text>
  <text x="1200" y="366" class="sans muted" font-size="14">Resolved without human transfer</text>
  <text x="1000" y="394" class="sans blue" font-size="15" font-weight="700">Successful removal rate</text>
  <text x="1200" y="394" class="sans muted" font-size="14">Safe automated blocks removed</text>
  <text x="1000" y="422" class="sans red" font-size="15" font-weight="700">Drop rate</text>
  <text x="1200" y="422" class="sans muted" font-size="14">Customers leaving before resolution</text>

  <line x1="1000" y1="445" x2="1510" y2="445" stroke="#d8dee8"/>
  <text x="1000" y="477" class="sans ink" font-size="17" font-weight="700">Routing and escalation</text>
  <text x="1000" y="506" class="sans orange" font-size="15" font-weight="700">Fraud transfer rate</text>
  <text x="1200" y="506" class="sans muted" font-size="14">Suspected fraud sent to specialist</text>
  <text x="1000" y="534" class="sans blue" font-size="15" font-weight="700">Non-fraud transfer rate</text>
  <text x="1200" y="534" class="sans muted" font-size="14">Wrong-department demand</text>
  <text x="1000" y="562" class="sans red" font-size="15" font-weight="700">Authentication failure</text>
  <text x="1200" y="562" class="sans muted" font-size="14">Failed or suspicious verification</text>

  <line x1="1000" y1="585" x2="1510" y2="585" stroke="#d8dee8"/>
  <text x="1000" y="617" class="sans ink" font-size="17" font-weight="700">Efficiency, reliability, and safety</text>
  <text x="1000" y="646" class="sans cyan" font-size="15" font-weight="700">Calls / tokens / cost</text>
  <text x="1200" y="646" class="sans muted" font-size="14">Per session and successful outcome</text>
  <text x="1000" y="674" class="sans blue" font-size="15" font-weight="700">p50 / p95 latency</text>
  <text x="1200" y="674" class="sans muted" font-size="14">Typical and slow customer experience</text>
  <text x="1000" y="702" class="sans orange" font-size="15" font-weight="700">Clarification / retries</text>
  <text x="1200" y="702" class="sans muted" font-size="14">Loops, parsing, and tool instability</text>
  <text x="1000" y="730" class="sans red" font-size="15" font-weight="700">Safety violations</text>
  <text x="1200" y="730" class="sans muted" font-size="14">Protected actions without evidence</text>

  <!-- Footnote -->
  <rect x="65" y="778" width="1470" height="91" rx="12" fill="#fafbfc" stroke="#d8dee8"/>
  <text x="83" y="805" class="sans ink" font-size="13" font-weight="700">ASSUMPTIONS AND SOURCE</text>
  <text x="83" y="829" class="sans muted" font-size="12.5">500,000 annual calls; 60% successful at 6 API calls; 40% unsuccessful at 5; $14 avoided human handling per successful call.</text>
  <text x="83" y="851" class="sans muted" font-size="12.5">Token proxy comes from one measured DeepSeek session. Excludes telephony, infrastructure, monitoring, maintenance, and human escalation costs.</text>
  <text x="1002" y="829" class="sans blue" font-size="12.5">Claude Fable 5: $10/MTok input; $50/MTok output.</text>
  <text x="1002" y="851" class="sans blue" font-size="12.5">Source: anthropic.com/news/claude-fable-5-mythos-5</text>
</svg>
