<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .mono { font-family: Menlo, Monaco, Consolas, monospace; }
    .white { fill: #f5f7fa; }
    .ink { fill: #172033; }
    .muted { fill: #5f6b7a; }
    .cyan { fill: #087ea4; }
    .blue { fill: #2563a8; }
    .green { fill: #168653; }
    .orange { fill: #b65f00; }
    .code { font-size: 18px; }
  </style>

  <text x="65" y="62" class="sans ink" font-size="34" font-weight="700">Authentication Evaluation — Unit Test vs. Deterministic Code Check</text>
  <text x="65" y="98" class="sans muted" font-size="17">The same fictional customer and expected outcome are examined at two different levels of the system.</text>
  <line x1="65" y1="122" x2="1535" y2="122" stroke="#d8dee8" stroke-width="2"/>

  <!-- Shared scenario -->
  <rect x="65" y="148" width="1470" height="105" rx="14" fill="#f3f8fc" stroke="#b9c9da" stroke-width="2"/>
  <rect x="65" y="148" width="9" height="105" fill="#20a7d3"/>
  <text x="93" y="179" class="sans cyan" font-size="18" font-weight="700">SHARED SCENARIO</text>
  <text x="93" y="218" class="mono ink" font-size="19">Card number: 4111111111111111</text>
  <text x="465" y="218" class="mono ink" font-size="19">DOB: 1990-01-15</text>
  <text x="738" y="218" class="mono ink" font-size="19">Expected customer: CUST-001</text>
  <text x="1120" y="218" class="mono green" font-size="19">Expected: Authentication succeeds</text>

  <!-- Left panel -->
  <rect x="65" y="282" width="660" height="487" rx="16" fill="#f8faff" stroke="#4b79b5" stroke-width="2"/>
  <rect x="65" y="282" width="660" height="62" rx="16" fill="#e8f1fb"/>
  <rect x="65" y="328" width="660" height="16" fill="#e8f1fb"/>
  <text x="92" y="320" class="sans blue" font-size="24" font-weight="700">UNIT TEST</text>
  <text x="267" y="320" class="sans muted" font-size="17">Isolated component</text>

  <rect x="88" y="365" width="614" height="318" rx="11" fill="#0c1017" stroke="#293348"/>
  <text x="110" y="402" class="mono code"><tspan fill="#c792ea">def</tspan><tspan fill="#f5f7fa"> test_authentication_with_valid_credentials():</tspan></text>
  <text x="110" y="437" class="mono code white">    result = authenticate_customer(</text>
  <text x="110" y="472" class="mono code"><tspan fill="#f5f7fa">        card_number=</tspan><tspan fill="#c3e88d">"4111111111111111"</tspan><tspan fill="#f5f7fa">,</tspan></text>
  <text x="110" y="507" class="mono code"><tspan fill="#f5f7fa">        date_of_birth=</tspan><tspan fill="#c3e88d">"1990-01-15"</tspan><tspan fill="#f5f7fa">,</tspan></text>
  <text x="110" y="542" class="mono code white">    )</text>
  <text x="110" y="594" class="mono code"><tspan fill="#c792ea">    assert</tspan><tspan fill="#f5f7fa"> result[</tspan><tspan fill="#c3e88d">"success"</tspan><tspan fill="#f5f7fa">] is </tspan><tspan fill="#82aaff">True</tspan></text>
  <text x="110" y="629" class="mono code"><tspan fill="#c792ea">    assert</tspan><tspan fill="#f5f7fa"> result[</tspan><tspan fill="#c3e88d">"customer_id"</tspan><tspan fill="#f5f7fa">] == </tspan><tspan fill="#c3e88d">"CUST-001"</tspan></text>
  <text x="110" y="664" class="mono code"><tspan fill="#c792ea">    assert</tspan><tspan fill="#f5f7fa"> result[</tspan><tspan fill="#c3e88d">"card_id"</tspan><tspan fill="#f5f7fa">] == </tspan><tspan fill="#c3e88d">"CARD-001"</tspan></text>

  <text x="92" y="714" class="sans ink" font-size="18" font-weight="700">Evidence source:</text>
  <text x="246" y="714" class="sans muted" font-size="18">direct function return</text>
  <text x="92" y="744" class="sans ink" font-size="18" font-weight="700">Proves:</text>
  <text x="165" y="744" class="sans muted" font-size="18">the authentication function works when called correctly</text>

  <!-- Right panel -->
  <rect x="750" y="282" width="785" height="487" rx="16" fill="#f7fcf9" stroke="#2f9a67" stroke-width="2"/>
  <rect x="750" y="282" width="785" height="62" rx="16" fill="#e6f6ed"/>
  <rect x="750" y="328" width="785" height="16" fill="#e6f6ed"/>
  <text x="777" y="320" class="sans green" font-size="24" font-weight="700">DETERMINISTIC CODE CHECK</text>
  <text x="1168" y="320" class="sans muted" font-size="17">Complete agent session</text>

  <rect x="773" y="365" width="739" height="318" rx="11" fill="#0c1017" stroke="#293348"/>
  <text x="793" y="394" class="mono" font-size="16"><tspan fill="#6f7c90"># Run the complete customer scenario</tspan></text>
  <text x="793" y="422" class="mono" font-size="16"><tspan fill="#f5f7fa">trace = run_agent_scenario(successful_block_removal)</tspan></text>
  <text x="793" y="459" class="mono" font-size="16"><tspan fill="#f5f7fa">expected = {</tspan><tspan fill="#c3e88d">"authentication_succeeded"</tspan><tspan fill="#f5f7fa">: </tspan><tspan fill="#82aaff">True</tspan><tspan fill="#f5f7fa">,</tspan></text>
  <text x="793" y="487" class="mono" font-size="16"><tspan fill="#c3e88d">            "customer_id"</tspan><tspan fill="#f5f7fa">: </tspan><tspan fill="#c3e88d">"CUST-001"</tspan><tspan fill="#f5f7fa">, </tspan><tspan fill="#c3e88d">"card_id"</tspan><tspan fill="#f5f7fa">: </tspan><tspan fill="#c3e88d">"CARD-001"</tspan><tspan fill="#f5f7fa">}</tspan></text>
  <text x="793" y="524" class="mono" font-size="16"><tspan fill="#f5f7fa">actual = {</tspan><tspan fill="#c3e88d">"authentication_succeeded"</tspan><tspan fill="#f5f7fa">: trace.authentication_succeeded,</tspan></text>
  <text x="793" y="552" class="mono" font-size="16"><tspan fill="#c3e88d">          "customer_id"</tspan><tspan fill="#f5f7fa">: trace.authenticated_customer_id,</tspan></text>
  <text x="793" y="580" class="mono" font-size="16"><tspan fill="#c3e88d">          "card_id"</tspan><tspan fill="#f5f7fa">: trace.selected_card_id}</tspan></text>
  <text x="793" y="617" class="mono" font-size="16"><tspan fill="#c792ea">assert</tspan><tspan fill="#f5f7fa"> actual == expected</tspan></text>
  <text x="793" y="645" class="mono" font-size="16"><tspan fill="#6f7c90"># PASS only when every extracted value matches</tspan></text>

  <text x="777" y="714" class="sans ink" font-size="18" font-weight="700">Evidence source:</text>
  <text x="931" y="714" class="sans muted" font-size="18">structured trace from the complete run</text>
  <text x="777" y="744" class="sans ink" font-size="18" font-weight="700">Proves:</text>
  <text x="850" y="744" class="sans muted" font-size="18">the workflow reached authentication and produced the expected result</text>

  <!-- Bottom takeaway -->
  <rect x="65" y="796" width="1470" height="70" rx="14" fill="#fff7e8" stroke="#e58a1f" stroke-width="2"/>
  <text x="91" y="826" class="sans orange" font-size="18" font-weight="700">KEY DIFFERENCE</text>
  <text x="91" y="852" class="sans ink" font-size="19">A unit test validates the component directly; a code check validates that the complete agent reached and used that component correctly.</text>
</svg>
