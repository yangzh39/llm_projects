<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .mono { font-family: Menlo, Monaco, Consolas, monospace; }
    .ink { fill: #172033; }
    .muted { fill: #5f6b7a; }
    .blue { fill: #2563a8; }
    .cyan { fill: #087ea4; }
    .green { fill: #168653; }
    .red { fill: #c83b3b; }
    .orange { fill: #b65f00; }
  </style>

  <!-- Header -->
  <text x="65" y="60" class="sans ink" font-size="34" font-weight="700">Trajectory Checks — Validate the Path, Not Just the Outcome</text>
  <text x="65" y="96" class="sans muted" font-size="17">Trajectory evaluation covers the agent’s intermediate actions; execution order is one important dimension.</text>
  <line x1="65" y1="121" x2="1535" y2="121" stroke="#d8dee8" stroke-width="2"/>

  <!-- Definition and best practice -->
  <rect x="65" y="146" width="920" height="104" rx="14" fill="#f3f8fc" stroke="#b9c9da" stroke-width="2"/>
  <rect x="65" y="146" width="9" height="104" fill="#20a7d3"/>
  <text x="93" y="178" class="sans cyan" font-size="18" font-weight="700">DEFINITION</text>
  <text x="93" y="209" class="sans ink" font-size="19">Evaluates the intermediate decisions, actions, tool use, evidence, and state</text>
  <text x="93" y="234" class="sans ink" font-size="19">transitions an agent followed to reach an outcome.</text>

  <rect x="1008" y="146" width="527" height="104" rx="14" fill="#fff7e8" stroke="#e4b264" stroke-width="2"/>
  <text x="1036" y="178" class="sans orange" font-size="18" font-weight="700">BEST PRACTICE</text>
  <text x="1036" y="209" class="sans ink" font-size="17">Enforce business-critical dependencies.</text>
  <text x="1036" y="234" class="sans muted" font-size="16">Allow alternative paths when exact order is unnecessary.</text>

  <!-- Coverage -->
  <text x="65" y="286" class="sans ink" font-size="19" font-weight="700">What trajectory checks can evaluate</text>

  <g>
    <rect x="65" y="306" width="232" height="78" rx="11" fill="#f8faff" stroke="#aac3e4"/>
    <text x="83" y="335" class="sans blue" font-size="16" font-weight="700">Required steps</text>
    <text x="83" y="363" class="sans muted" font-size="14">Did mandatory actions occur?</text>

    <rect x="313" y="306" width="232" height="78" rx="11" fill="#fff8f8" stroke="#e5b0b0"/>
    <text x="331" y="335" class="sans red" font-size="16" font-weight="700">Prohibited steps</text>
    <text x="331" y="363" class="sans muted" font-size="14">Were forbidden actions avoided?</text>

    <rect x="561" y="306" width="232" height="78" rx="11" fill="#fff7e8" stroke="#e4b264"/>
    <text x="579" y="335" class="sans orange" font-size="16" font-weight="700">Order &amp; dependencies</text>
    <text x="579" y="363" class="sans muted" font-size="14">Did prerequisites happen first?</text>

    <rect x="809" y="306" width="232" height="78" rx="11" fill="#f7fcf9" stroke="#a9d8be"/>
    <text x="827" y="335" class="sans green" font-size="16" font-weight="700">Tool selection</text>
    <text x="827" y="363" class="sans muted" font-size="14">Were appropriate tools used?</text>

    <rect x="1057" y="306" width="232" height="78" rx="11" fill="#f3f8fc" stroke="#b9c9da"/>
    <text x="1075" y="335" class="sans cyan" font-size="16" font-weight="700">Arguments &amp; evidence</text>
    <text x="1075" y="363" class="sans muted" font-size="14">Were the correct inputs used?</text>

    <rect x="1305" y="306" width="230" height="78" rx="11" fill="#f7f7fa" stroke="#c7ccd5"/>
    <text x="1323" y="335" class="sans ink" font-size="16" font-weight="700">Efficiency</text>
    <text x="1323" y="363" class="sans muted" font-size="14">Were calls or loops unnecessary?</text>
  </g>

  <!-- Scenario overview -->
  <rect x="65" y="410" width="1470" height="72" rx="12" fill="#f5f7fa" stroke="#cbd3df" stroke-width="2"/>
  <text x="88" y="439" class="sans ink" font-size="17" font-weight="700">SEQUENCING EXAMPLE</text>
  <text x="88" y="466" class="mono ink" font-size="16">CUST-002  •  CARD-002  •  Expected final status: active  •  Actual final status: active</text>
  <text x="895" y="466" class="sans red" font-size="16" font-weight="700">Rule: recognize transaction before approval and removal</text>

  <!-- Expected trajectory -->
  <rect x="65" y="510" width="445" height="274" rx="14" fill="#f7fcf9" stroke="#2f9a67" stroke-width="2"/>
  <rect x="65" y="510" width="445" height="52" rx="14" fill="#e6f6ed"/>
  <rect x="65" y="548" width="445" height="14" fill="#e6f6ed"/>
  <text x="88" y="543" class="sans green" font-size="20" font-weight="700">EXPECTED TRAJECTORY</text>

  <text x="92" y="590" class="mono ink" font-size="16">1  authentication_success</text>
  <text x="92" y="619" class="mono ink" font-size="16">2  ownership_verified</text>
  <text x="92" y="648" class="mono ink" font-size="16">3  transaction_retrieved</text>
  <text x="92" y="677" class="mono green" font-size="16" font-weight="700">4  transaction_recognized</text>
  <text x="92" y="706" class="mono ink" font-size="16">5  eligibility_approved</text>
  <text x="92" y="735" class="mono ink" font-size="16">6  block_removed</text>
  <text x="92" y="764" class="mono ink" font-size="16">7  final_state_verified</text>

  <!-- Faulty trajectory -->
  <rect x="530" y="510" width="520" height="274" rx="14" fill="#fff8f8" stroke="#cf5a5a" stroke-width="2"/>
  <rect x="530" y="510" width="520" height="52" rx="14" fill="#fdeaea"/>
  <rect x="530" y="548" width="520" height="14" fill="#fdeaea"/>
  <text x="553" y="543" class="sans red" font-size="20" font-weight="700">FAULTY RECORDED TRAJECTORY</text>

  <text x="557" y="590" class="mono ink" font-size="16">1  authentication_success</text>
  <text x="557" y="619" class="mono ink" font-size="16">2  ownership_verified</text>
  <text x="557" y="648" class="mono ink" font-size="16">3  transaction_retrieved</text>
  <rect x="548" y="660" width="474" height="51" rx="8" fill="#ffe2e2"/>
  <text x="557" y="682" class="mono red" font-size="16" font-weight="700">4  eligibility_approved  ← TOO EARLY</text>
  <text x="557" y="704" class="mono red" font-size="16" font-weight="700">5  block_removed         ← TOO EARLY</text>
  <text x="557" y="735" class="mono ink" font-size="16">6  transaction_recognized</text>
  <text x="557" y="764" class="mono ink" font-size="16">7  final_state_verified</text>

  <!-- Result -->
  <rect x="1070" y="510" width="465" height="274" rx="14" fill="#f8faff" stroke="#aac3e4" stroke-width="2"/>
  <text x="1095" y="543" class="sans blue" font-size="20" font-weight="700">EVALUATION RESULT</text>
  <line x1="1095" y1="562" x2="1510" y2="562" stroke="#d8dee8"/>

  <text x="1095" y="599" class="sans ink" font-size="17" font-weight="700">Outcome check</text>
  <text x="1095" y="626" class="mono muted" font-size="15">active == active</text>
  <rect x="1406" y="580" width="104" height="48" rx="9" fill="#e1f5e9" stroke="#2f9a67"/>
  <text x="1458" y="610" class="sans green" font-size="18" font-weight="700" text-anchor="middle">PASS</text>

  <text x="1095" y="672" class="sans ink" font-size="17" font-weight="700">Sequencing check</text>
  <text x="1095" y="699" class="mono muted" font-size="15">recognition before approval</text>
  <text x="1095" y="724" class="mono red" font-size="15">position 6 &lt; position 4 = false</text>
  <rect x="1406" y="675" width="104" height="48" rx="9" fill="#fde5e5" stroke="#cf5a5a"/>
  <text x="1458" y="705" class="sans red" font-size="18" font-weight="700" text-anchor="middle">FAIL</text>

  <text x="1095" y="758" class="sans red" font-size="17" font-weight="700">Overall trajectory result: FAIL</text>

  <!-- Takeaway -->
  <rect x="65" y="808" width="1470" height="62" rx="13" fill="#fff7e8" stroke="#e58a1f" stroke-width="2"/>
  <text x="90" y="835" class="sans orange" font-size="17" font-weight="700">KEY TAKEAWAY</text>
  <text x="90" y="858" class="sans ink" font-size="18">A correct final state is insufficient when a protected action occurred before its required evidence was established.</text>
</svg>
