<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .ink { fill: #172033; }
    .muted { fill: #5f6b7a; }
    .blue { fill: #2563a8; }
    .cyan { fill: #087ea4; }
    .orange { fill: #b65f00; }
    .green { fill: #168653; }
    .purple { fill: #7651a8; }
  </style>

  <!-- Header -->
  <text x="60" y="62" class="sans ink" font-size="34" font-weight="700">AI Product Evolution — From Conversation to Action</text>
  <text x="60" y="98" class="sans muted" font-size="17">2022–2026  |  Models became multimodal and agentic as adoption expanded from individuals to institutions.</text>
  <line x1="60" y1="126" x2="1540" y2="126" stroke="#53c7ed" stroke-width="4"/>

  <!-- Legend -->
  <circle cx="1215" cy="91" r="6" fill="#2563a8"/><text x="1230" y="97" class="sans muted" font-size="13">OpenAI</text>
  <circle cx="1315" cy="91" r="6" fill="#7651a8"/><text x="1330" y="97" class="sans muted" font-size="13">Anthropic</text>
  <circle cx="1428" cy="91" r="6" fill="#168653"/><text x="1443" y="97" class="sans muted" font-size="13">Adoption</text>

  <text x="60" y="171" class="sans blue" font-size="18" font-weight="700">CAPABILITY MILESTONES</text>
  <text x="1540" y="171" class="sans muted" font-size="13" text-anchor="end">Curated public milestones—not an exhaustive product history</text>

  <!-- Timeline baseline -->
  <line x1="88" y1="424" x2="1515" y2="424" stroke="#9aa7b8" stroke-width="5" stroke-linecap="round"/>
  <polygon points="1533,424 1508,409 1508,439" fill="#9aa7b8"/>

  <!-- 2022 ChatGPT launch tweet -->
  <rect x="45" y="198" width="280" height="165" rx="16" fill="#f3f8fc" stroke="#aac3e4" stroke-width="2"/>
  <circle cx="78" cy="232" r="19" fill="#172033"/>
  <text x="78" y="239" fill="#ffffff" class="sans" font-size="16" font-weight="700" text-anchor="middle">SA</text>
  <text x="109" y="226" class="sans ink" font-size="15" font-weight="700">Sam Altman</text>
  <text x="109" y="247" class="sans muted" font-size="13">@sama • Nov 30, 2022</text>
  <text x="67" y="287" class="sans ink" font-size="17" font-weight="700">“today we launched ChatGPT.</text>
  <text x="67" y="313" class="sans ink" font-size="17" font-weight="700">try talking with it here:”</text>
  <text x="67" y="341" class="sans blue" font-size="14">The public starting point</text>
  <line x1="180" y1="363" x2="180" y2="413" stroke="#2563a8" stroke-width="2"/>
  <circle cx="180" cy="424" r="12" fill="#2563a8" stroke="#ffffff" stroke-width="4"/>

  <!-- 2023 GPT-4 + Claude -->
  <line x1="410" y1="435" x2="410" y2="482" stroke="#7651a8" stroke-width="2"/>
  <circle cx="410" cy="424" r="12" fill="#7651a8" stroke="#ffffff" stroke-width="4"/>
  <rect x="300" y="482" width="220" height="145" rx="15" fill="#f8f5fc" stroke="#bda8d6" stroke-width="2"/>
  <text x="318" y="512" class="sans purple" font-size="15" font-weight="700">MAR 2023</text>
  <text x="318" y="550" class="sans ink" font-size="21" font-weight="700">GPT-4 + Claude</text>
  <text x="318" y="581" class="sans muted" font-size="15">Frontier assistants:</text>
  <text x="318" y="602" class="sans muted" font-size="15">multimodal + steerable</text>

  <!-- 2024 multimodal + tool ecosystem -->
  <rect x="515" y="208" width="220" height="145" rx="15" fill="#f3fbfe" stroke="#8fcfe3" stroke-width="2"/>
  <text x="533" y="238" class="sans cyan" font-size="15" font-weight="700">MAY–NOV 2024</text>
  <text x="533" y="272" class="sans ink" font-size="19" font-weight="700">Multimodal + tools</text>
  <text x="533" y="303" class="sans muted" font-size="14">GPT-4o • Computer Use</text>
  <text x="533" y="325" class="sans muted" font-size="14">• Model Context Protocol</text>
  <line x1="625" y1="353" x2="625" y2="413" stroke="#087ea4" stroke-width="2"/>
  <circle cx="625" cy="424" r="12" fill="#087ea4" stroke="#ffffff" stroke-width="4"/>

  <!-- 2025 Claude Code -->
  <line x1="835" y1="435" x2="835" y2="482" stroke="#7651a8" stroke-width="2"/>
  <circle cx="835" cy="424" r="12" fill="#7651a8" stroke="#ffffff" stroke-width="4"/>
  <rect x="728" y="482" width="214" height="145" rx="15" fill="#f8f5fc" stroke="#bda8d6" stroke-width="2"/>
  <text x="746" y="512" class="sans purple" font-size="15" font-weight="700">FEB 2025</text>
  <text x="746" y="550" class="sans ink" font-size="22" font-weight="700">Claude Code</text>
  <text x="746" y="581" class="sans muted" font-size="15">An agent works directly</text>
  <text x="746" y="602" class="sans muted" font-size="15">inside the terminal</text>

  <!-- 2025 Codex -->
  <rect x="935" y="208" width="210" height="145" rx="15" fill="#f3f8fc" stroke="#aac3e4" stroke-width="2"/>
  <text x="953" y="238" class="sans blue" font-size="15" font-weight="700">MAY 2025</text>
  <text x="953" y="276" class="sans ink" font-size="23" font-weight="700">Codex</text>
  <text x="953" y="307" class="sans muted" font-size="15">Cloud agent edits, tests</text>
  <text x="953" y="328" class="sans muted" font-size="15">and proposes changes</text>
  <line x1="1040" y1="353" x2="1040" y2="413" stroke="#2563a8" stroke-width="2"/>
  <circle cx="1040" cy="424" r="12" fill="#2563a8" stroke="#ffffff" stroke-width="4"/>

  <!-- 2025 institutional adoption -->
  <line x1="1250" y1="435" x2="1250" y2="482" stroke="#168653" stroke-width="2"/>
  <circle cx="1250" cy="424" r="12" fill="#168653" stroke="#ffffff" stroke-width="4"/>
  <rect x="1140" y="482" width="220" height="145" rx="15" fill="#f7fcf9" stroke="#a9d8be" stroke-width="2"/>
  <text x="1158" y="512" class="sans green" font-size="15" font-weight="700">JAN–JUL 2025</text>
  <text x="1158" y="548" class="sans ink" font-size="20" font-weight="700">Institutional AI</text>
  <text x="1158" y="579" class="sans muted" font-size="14">ChatGPT Gov • Claude Gov</text>
  <text x="1158" y="601" class="sans muted" font-size="14">enterprise + defense use</text>

  <!-- 2026 frontier -->
  <rect x="1340" y="208" width="220" height="145" rx="15" fill="#fff7e8" stroke="#e4b264" stroke-width="2"/>
  <text x="1358" y="238" class="sans orange" font-size="15" font-weight="700">JUN–JUL 2026</text>
  <text x="1358" y="269" class="sans ink" font-size="17" font-weight="700">Fable / Mythos 5</text>
  <text x="1358" y="292" class="sans ink" font-size="17" font-weight="700">GPT-5.6 Sol</text>
  <text x="1358" y="323" class="sans muted" font-size="14">Long-horizon, tool-rich</text>
  <text x="1358" y="343" class="sans muted" font-size="14">frontier systems</text>
  <line x1="1450" y1="353" x2="1450" y2="413" stroke="#b65f00" stroke-width="2"/>
  <circle cx="1450" cy="424" r="12" fill="#b65f00" stroke="#ffffff" stroke-width="4"/>

  <!-- Adoption expansion -->
  <text x="60" y="688" class="sans green" font-size="18" font-weight="700">ADOPTION EXPANDS</text>
  <text x="232" y="688" class="sans muted" font-size="13">Each stage adds users, workflows, controls, and institutional responsibility.</text>

  <g class="sans">
    <polygon points="60,714 330,714 352,752 330,790 60,790" fill="#e8f1fb"/>
    <text x="192" y="744" class="blue" font-size="16" font-weight="700" text-anchor="middle">PERSONAL USERS</text>
    <text x="192" y="770" class="muted" font-size="14" text-anchor="middle">Everyday conversations</text>

    <polygon points="335,714 620,714 642,752 620,790 335,790 357,752" fill="#eef4fc"/>
    <text x="487" y="744" class="blue" font-size="16" font-weight="700" text-anchor="middle">BUILDERS</text>
    <text x="487" y="770" class="muted" font-size="14" text-anchor="middle">Apps through APIs</text>

    <polygon points="625,714 910,714 932,752 910,790 625,790 647,752" fill="#f3fbfe"/>
    <text x="777" y="744" class="cyan" font-size="16" font-weight="700" text-anchor="middle">ENTERPRISES</text>
    <text x="777" y="770" class="muted" font-size="14" text-anchor="middle">Secure business workflows</text>

    <polygon points="915,714 1200,714 1222,752 1200,790 915,790 937,752" fill="#f8f5fc"/>
    <text x="1067" y="744" class="purple" font-size="16" font-weight="700" text-anchor="middle">AGENTIC WORK</text>
    <text x="1067" y="770" class="muted" font-size="14" text-anchor="middle">Delegated, multi-step tasks</text>

    <polygon points="1205,714 1518,714 1542,752 1518,790 1205,790 1227,752" fill="#edf9f2"/>
    <text x="1370" y="744" class="green" font-size="16" font-weight="700" text-anchor="middle">PUBLIC SECTOR + DEFENSE</text>
    <text x="1370" y="770" class="muted" font-size="14" text-anchor="middle">Governed institutional deployment</text>
  </g>

  <!-- Takeaway -->
  <rect x="60" y="820" width="1482" height="50" rx="13" fill="#172033"/>
  <text x="801" y="851" fill="#ffffff" class="sans" font-size="17" font-weight="700" text-anchor="middle">The trajectory is not only smarter models—it is a shift from answering questions to completing consequential work.</text>
  <text x="1540" y="892" class="sans muted" font-size="10" text-anchor="end">Dates: official OpenAI and Anthropic launch announcements.</text>
</svg>
